name: Security checks
on: [push, pull_request]
jobs:
  secrets-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Python dependencies audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt || true
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Frontend dependencies audit
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-scripts && yarn audit --level high || true
